name: Prepublish WordPress environment

on:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: 'Plugin branch, tag or commit to test (e.g. refs/pull/64/head); blank uses this workflow commit'
        required: false
        type: string

permissions:
  contents: read

jobs:
  wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the plugin version under test
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_ref || github.sha }}
          path: .plugin-under-test
          sparse-checkout: siteimprove
          persist-credentials: false
      - name: Record the plugin commit under test
        run: git -C .plugin-under-test rev-parse HEAD
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Point WordPress at the selected plugin
        run: node -e "require('node:fs').writeFileSync('.wp-env.override.json', JSON.stringify({plugins:['./.plugin-under-test/siteimprove']}))"
      - run: npm run env:start
      - run: npm run test:wordpress
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: prepublish-wordpress-report
          path: |
            playwright-wordpress-report/
            test-results/wordpress/
          retention-days: 14
      - run: npm run env:stop
        if: ${{ always() }}

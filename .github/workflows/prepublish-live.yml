name: Live Siteimprove test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteimprove-live-test
  cancel-in-progress: false

jobs:
  live:
    # Reviewed workflow code only. Environment approval is required separately.
    if: github.repository == 'Siteimprove/CMS-plugin-Wordpress' && github.event_name != 'pull_request'
    environment: siteimprove-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Explain test coverage
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### WordPress–Siteimprove live integration tests
          - Environment: Chromium; local WordPress connected to the real Siteimprove platform.
          - Coverage: Configuration, entitlement, login, Live page data, fresh draft handoff, and loading-state exit.
          - Skipped: Missing-title result assertion; scan-result correctness remains unverified.
          - Report: No artifacts are uploaded for this authenticated suite.
          - Results: see the test steps below; this description does not indicate a pass.
          SUMMARY
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the plugin commit under test
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .plugin-under-test
          sparse-checkout: siteimprove
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test live runner contracts and privacy safeguards
        run: npm run test:live:contracts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prepare-live-env.js
      - run: npm run env:start
      - name: Verify Live page data, draft handoff, and loading-state exit
        run: npm run test:live
        env:
          SITEIMPROVE_RUN_LIVE: '1'
          SITEIMPROVE_PUBLIC_URL: ${{ secrets.SITEIMPROVE_PUBLIC_URL }}
          SITEIMPROVE_CRAWLED_URL: ${{ secrets.SITEIMPROVE_CRAWLED_URL }}
          SITEIMPROVE_API_USERNAME: ${{ secrets.SITEIMPROVE_API_USERNAME }}
          SITEIMPROVE_API_KEY: ${{ secrets.SITEIMPROVE_API_KEY }}
          SITEIMPROVE_USERNAME: ${{ secrets.SITEIMPROVE_USERNAME }}
          SITEIMPROVE_PASSWORD: ${{ secrets.SITEIMPROVE_PASSWORD }}
          DEBUG: ''
          PWDEBUG: '0'
      - run: npm run env:stop
        if: ${{ always() }}
      # No screenshots, traces, browser state, server logs or account data uploads.
